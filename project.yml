name: GuitarCoach
options:
  bundleIdPrefix: com.pdelebarre
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CoachingEngine:
    path: CoachingEngine
targets:
  GuitarCoach:
    type: application
    platform: iOS
    sources: [GuitarCoach]
    dependencies:
      - package: CoachingEngine
    info:
      path: GuitarCoach/Info.plist
      properties:
        CFBundleDisplayName: GuitarCoach
        UILaunchScreen: {}
        NSCameraUsageDescription: "GuitarCoach uses the camera to show you where to place your fingers on the guitar neck. Frames are processed on-device and are never stored."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdelebarre.GuitarCoach
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1,2"
